name: PR Playwright Suite (ExUnit)

# Runs the ExUnit port of the @pr Playwright tests (assets/automation/ex, with
# playwright_ex) against a dedicated Torus instance, set up exactly as in
# pr-playwright.yml: an isolated database, Swoosh.Adapters.Local for email,
# and the /test/scenario-yaml and /test/emails endpoints (MIX_ENV=playwright).
#
# A ported module is tagged `@moduletag :pr`, as its JS spec is tagged "@pr".
#
# The suite also runs on pushes to integration branches, so
# the combined result of every PR merged into one is verified again.
on:
  merge_group:
    types: [checks_requested]
  pull_request:
    branches:
      - master
      - integ-*
      - story/*
      - bug/*
      - task/*
  push:
    branches:
      - integ-*
      - story/*
      - bug/*
      - task/*

jobs:
  pr-playwright-ex:
    name: PR Playwright Suite (ExUnit)
    # Kept on the JS job's runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read

    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_DB: oli_playwright_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d oli_playwright_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: playwright
      DB_NAME: oli_playwright_ci
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/oli_playwright_ci
      DB_SSL: "false"
      FORCE_SSL: "false"
      # HOST and PLAYWRIGHT_BASE_URL must name the same host: the server
      # builds absolute confirmation/reset links in emails from HOST, while
      # Playwright resolves every relative page.goto(...) against
      # PLAYWRIGHT_BASE_URL. A mismatch (e.g. 127.0.0.1 vs localhost) sends
      # the browser to an origin it never visited, with none of the earlier
      # cookies (including cookie consent) present there.
      HOST: localhost
      SCHEME: http
      HTTP_PORT: 4002
      PORT: 4002
      PLAYWRIGHT_BASE_URL: http://localhost:4002
      S3_MEDIA_BUCKET_NAME: torus-pr-media
      S3_XAPI_BUCKET_NAME: torus-pr-xapi
      BLOB_STORAGE_BUCKET_NAME: torus-pr-blob
      MEDIA_URL: http://localhost:9000/torus-pr-media
      AWS_S3_HOST: localhost
      AWS_S3_PORT: 9000
      AWS_S3_SCHEME: http
      AWS_ACCESS_KEY_ID: pr-unused
      AWS_SECRET_ACCESS_KEY: pr-unused
      AWS_EC2_METADATA_DISABLED: "true"
      XAPI_ETL_MODE: file
      EMAIL_FROM_ADDRESS: no-reply@example.test

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup BEAM toolchain
        uses: erlef/setup-beam@v1
        with:
          elixir-version: 1.19.2
          otp-version: 28.1.1
          gleam-version: "1.16.0"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: assets/automation/package-lock.json

      - name: Restore deps cache
        uses: actions/cache@v3
        with:
          path: |
            deps
            _build/playwright
          key: ${{ runner.os }}-${{ runner.arch }}-pr-playwright-beam-1.19.2-28.1.1-gleam-1.16.0-${{ hashFiles('.tool-versions', 'mix.exs', 'mix.lock', 'config/**', 'gleam/gleam.toml', 'gleam/manifest.toml') }}

      - name: Install Gleam Mix archive
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix archive.install hex mix_gleam 0.6.2 --force

      - name: Install Elixir dependencies
        run: mix deps.get

      - name: Build Gleam project
        run: gleam build --target erlang
        working-directory: gleam

      - name: Build dependencies
        run: mix deps.compile

      - name: Compile (MIX_ENV=playwright)
        run: mix compile --warnings-as-errors

      # Generate runtime-only values after compilation; none enter build caches.
      - name: Generate job-scoped runtime secrets
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import base64
          import os
          import secrets

          with open(os.environ["GITHUB_ENV"], "a") as env:
              for key, size in [("PLAYWRIGHT_SCENARIO_TOKEN", 32),
                                ("PLAYWRIGHT_CAPTCHA_TOKEN", 32),
                                ("SECRET_KEY_BASE", 64),
                                ("LIVE_VIEW_SALT", 32),
                                ("CLOAK_VAULT_KEY", 32)]:
                  value = base64.b64encode(secrets.token_bytes(size)).decode()
                  print(f"::add-mask::{value}")
                  env.write(f"{key}={value}\n")
          PYTHON

      # mix.exs's ecto.setup alias runs create, migrate, and
      # priv/repo/seeds.exs. Seeding is required, not optional: the
      # `system_roles` rows an Author's system_role_id foreign key points
      # at (ids 1/2) are only ever inserted by seeds.exs, not by any
      # migration - a fresh database with no seed data can migrate cleanly
      # and still reject every author insert with a foreign_key_constraint
      # error.
      - name: Create, migrate, and seed the ephemeral database
        run: mix ecto.setup

      - name: Install frontend dependencies
        working-directory: assets
        run: yarn install --frozen-lockfile

      # Match the release asset pipeline, including the Node evaluator bundle.
      - name: Build frontend and server assets
        working-directory: assets
        run: |
          NODE_ENV=production yarn run deploy
          NODE_ENV=production yarn run deploy-node

      - name: Build Tailwind and digested assets
        run: mix assets.deploy

      # The ported AxeBuilder runs the axe-core of @axe-core/playwright.
      - name: Install axe-core
        working-directory: assets/automation
        run: npm ci

      - name: Restore ExUnit suite cache
        uses: actions/cache@v3
        with:
          path: |
            assets/automation/ex/deps
            assets/automation/ex/_build
            ~/.cache/playwright
          key: ${{ runner.os }}-${{ runner.arch }}-pr-playwright-ex-beam-1.19.2-28.1.1-${{ hashFiles('assets/automation/ex/mix.exs', 'assets/automation/ex/mix.lock') }}

      - name: Install playwright_ex and Chrome
        working-directory: assets/automation/ex
        env:
          MIX_ENV: test
        run: |
          mix deps.get
          mix playwright.install chrome --with-deps

      - name: Start Torus (MIX_ENV=playwright)
        run: |
          nohup mix phx.server > /tmp/torus-server.log 2>&1 &

      - name: Wait for Torus to be ready
        run: |
          for _ in $(seq 1 60); do
            status=$(curl --silent --max-time 2 --output /dev/null --write-out '%{http_code}' "http://localhost:4002/readyz" || true)
            if [ "$status" = "200" ]; then
              echo "Torus is ready."
              exit 0
            fi
            sleep 2
          done
          echo "Torus did not become ready in time." >&2
          cat /tmp/torus-server.log
          exit 1

      # Modules run in parallel across 2 workers (config/config.exs); tests
      # within a module stay serial. Failed tests are rerun once, as
      # playwright.config.ts's retries: 1 (exit status 2 means tests failed),
      # each run with GitHub annotations (a test passing on the rerun counts
      # as flaky).
      - name: Run the @pr ExUnit tests
        working-directory: assets/automation/ex
        env:
          MIX_ENV: test
        run: |
          f="--formatter ExUnit.CLIFormatter --formatter Playwright.Test.GitHubFormatter"
          mix test --only pr $f || { [ $? -eq 2 ] && mix test --only pr --failed $f; }

      # Also when the rerun passed, to keep the failed run's files.
      - name: Upload Playwright test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: pr-playwright-ex-test-results
          path: assets/automation/ex/test-results/
          retention-days: 14

      # Raw request logs contain confirmation/reset URL credentials. Keep them
      # on the disposable runner until a sanitization contract is available.
      # - name: Upload Torus server log
      #   if: failure()
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: pr-playwright-ex-torus-server-log
      #     path: /tmp/torus-server.log
      #     retention-days: 14

    # The postgres service container (and its `oli_playwright_ci` database)
    # is destroyed with the job's runner; no manual cleanup step is needed.
